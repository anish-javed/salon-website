<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Branches – Clipper Men's Salon Lahore</title>
  <meta name="description" content="Find a Clipper branch in Gulberg, DHA, Johar Town or Model Town, Lahore.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="branches">
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="container reveal">
        <span class="eyebrow">Branches</span>
        <h1>Find your nearest Clipper</h1>
        <p>Pick your area to see the address, opening hours and map.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="area-buttons tabs" id="areaButtons" aria-label="Choose an area"></div>
        <div class="finder">
          <div class="card branch-card" id="branchCard" aria-live="polite"></div>
          <div class="map-box" id="mapBox"></div>
        </div>
      </div>
    </section>

    <section class="section alt">
      <div class="container">
        <div class="section-head reveal"><h2>Inside our branches</h2></div>
        <div class="grid cols-4">
          <!-- PHOTO SPOTS: replace each box with a real photo of that branch -->
          <div class="photo-slot reveal" data-icon="camera"><strong>PHOTO HERE</strong><small>Gulberg branch</small></div>
          <div class="photo-slot reveal d1" data-icon="camera"><strong>PHOTO HERE</strong><small>DHA branch</small></div>
          <div class="photo-slot reveal d2" data-icon="camera"><strong>PHOTO HERE</strong><small>Johar Town branch</small></div>
          <div class="photo-slot reveal d3" data-icon="camera"><strong>PHOTO HERE</strong><small>Model Town branch</small></div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/branches.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
